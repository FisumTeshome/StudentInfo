version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      POSTGRES_DB: ${DB_NAME:-trainingschedule}
      POSTGRES_USER: root
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema_pg.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./database/seed_pg.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d trainingschedule"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build: ./backend
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD:-rootpassword}
      - DB_NAME=${DB_NAME:-trainingschedule}
      - PORT=8081
      - CORS_ORIGIN=http://localhost:3000
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pg_data:
